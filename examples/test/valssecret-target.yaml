# A ValsSecret that renders the data into a ConfigMap in place of a Secret. The
# operator sets its status and Ready condition once it has applied the target.
apiVersion: digitalis.io/v1
kind: ValsSecret
metadata:
  name: test-target
spec:
  data:
    api_key:
      ref: ref+vault://secret/data/test#/api_key
  target:
    apiVersion: v1
    kind: ConfigMap
    name: test-config
    mode: create
    labels:
      app.kubernetes.io/name: test-app
    annotations:
      example.com/owner: platform
    template: |-
      data:
        api-key: {{ .api_key | quote }}
