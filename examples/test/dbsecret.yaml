# A DbSecret that writes the Secret test-db-credentials with credentials from
# the database secrets engine of Vault, renews their lease, and restarts a
# StatefulSet when they change.
apiVersion: digitalis.io/v1beta1
kind: DbSecret
metadata:
  name: test
spec:
  secretName: test-db-credentials
  renew: true
  vault:
    mount: database
    role: test-app
  template:
    DATABASE_URL: postgres://{{ .username }}:{{ .password }}@postgres:5432/test
  rollout:
  - kind: StatefulSet
    name: test-worker
