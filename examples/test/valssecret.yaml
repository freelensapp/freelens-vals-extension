# A ValsSecret that writes the Secret test-credentials from Vault and an AWS
# Secrets Manager secret, updates the password of a PostgreSQL user, and
# restarts a Deployment when the Secret changes.
apiVersion: digitalis.io/v1
kind: ValsSecret
metadata:
  name: test
spec:
  name: test-credentials
  ttl: 3600
  type: Opaque
  data:
    username:
      ref: ref+vault://secret/data/test#/username
    password:
      ref: ref+vault://secret/data/test#/password
    ca.crt:
      ref: ref+awssecrets://test/ca-certificate
      encoding: base64
  template:
    config.yaml: |
      username: {{ .username }}
      password: {{ .password }}
  databases:
  - driver: postgres
    hosts:
    - postgres-0.postgres
    - postgres-1.postgres
    port: 5432
    usernameKey: username
    passwordKey: password
    loginCredentials:
      secretName: postgres-admin
      usernameKey: user
      passwordKey: password
  rollout:
  - kind: Deployment
    name: test-app
